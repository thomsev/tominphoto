<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="cloud" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".002 .003" numOctaves="3" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .91  0 0 0 0 .94  0 0 0 0 .94  0 0 0 5 -2.05" result="body"/>
      <feGaussianBlur in="body" stdDeviation="10" result="soft"/>
      <feDiffuseLighting in="noise" surfaceScale="3" diffuseConstant="1.25" lighting-color="#ffffff" result="light"><feDistantLight azimuth="230" elevation="48"/></feDiffuseLighting>
      <feComposite in="light" in2="soft" operator="in"/>
    </filter>
    <radialGradient id="fade"><stop offset="25%" stop-color="white"/><stop offset="100%" stop-color="black"/></radialGradient>
    <mask id="edges"><rect width="1600" height="1000" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="1000" filter="url(#cloud)" mask="url(#edges)"/>
</svg>
